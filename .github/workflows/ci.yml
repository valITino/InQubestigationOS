name: checks

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Monday 06:00 UTC. docs/GUIDE.md used to ask a human to check the Zeek OBS
    # key and the Wazuh release every month; this does it instead.
    - cron: "0 6 * * 1"

jobs:
  harness:
    name: fake-dom0 harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install review tools
        run: python3 -m pip install -r requirements-dev.txt
      # host_checks asks apt-cache about every package in the build-host plan.
      # Hosted-runner indexes can be stale or absent; without an update the
      # same probe fails once in run_tests.py and again in the standalone step.
      - name: Enable the Ubuntu package set used by setup-host
        run: |
          sudo add-apt-repository --yes universe
          sudo apt-get update
      - name: Compile both scripts
        run: python3 -m py_compile golden_image.py build_iso.py bootstrap_workflow.py release_candidate.py acceptance_runner.py
      - name: Lint Python
        run: ruff check .
      - name: Scan Python for high-severity security defects
        run: python3 -m bandit -q -lll -r build_iso.py bootstrap_workflow.py golden_image.py release_candidate.py acceptance_runner.py tests
      - name: Run the harness
        run: ./tests/run_tests.py
      - name: Test unattended build-host orchestration
        run: ./tests/orchestration_checks.py
      - name: Test guided bootstrap, mounts, state, and authenticated export
        run: ./tests/bootstrap_workflow_checks.py
      - name: Test installation and first-boot path
        run: ./tests/install_path_checks.py
      - name: Test release-candidate policy gates
        run: ./tests/release_checks.py
      - name: Test acceptance evidence and maintenance gates
        run: ./tests/acceptance_checks.py
      # Also run standalone so a failure names itself in the job summary.
      - name: The build-host support holds up
        if: always()
        run: ./tests/host_checks.py
      - name: Configuration agrees with the code
        if: always()
        run: ./tests/config_checks.py
      - name: Documentation agrees with the code
        if: always()
        run: ./tests/doc_checks.py

  fedora-host:
    name: Fedora live build-host support
    runs-on: ubuntu-latest
    container:
      image: fedora:43
    steps:
      - uses: actions/checkout@v7
      - name: Install Python
        run: dnf install -y python3
      - name: Check Fedora packages against live DNF repositories
        run: python3 ./tests/host_checks.py

  supply-chain:
    name: supply chain drift
    runs-on: ubuntu-latest
    # Network-dependent: informational on a normal push, blocking on schedule.
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compare pinned keys and versions against upstream
        # Detection never accepts drift. An owner runs --update on a review
        # branch only after independently validating every changed fingerprint.
        run: ./build_iso.py check-upstream
